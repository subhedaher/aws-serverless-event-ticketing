<text x="40" y="52" font-size="30" font-weight="800" fill="#0f172a">Event Ticketing System — Serverless on AWS</text><text x="40" y="82" font-size="16" fill="#475569">event.subhe.site · api.subhe.site · ACM certificates · DNS on Namecheap · region us-east-1</text><g><rect x="40" y="400" width="200" height="110" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/><rect x="40" y="400" width="200" height="8" rx="4" fill="#475569"/><text x="140.0" y="436" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Browser</text><text x="140.0" y="462" text-anchor="middle" font-size="14.5" fill="#475569">Attendees &amp; admins</text><text x="140.0" y="484" text-anchor="middle" font-size="14.5" fill="#475569">HTML + JavaScript</text></g><g><rect x="330" y="130" width="230" height="90" rx="10" fill="#ffffff" stroke="#8C4FFF" stroke-width="2"/><rect x="330" y="130" width="230" height="8" rx="4" fill="#8C4FFF"/><text x="445.0" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Amazon CloudFront</text><text x="445.0" y="192" text-anchor="middle" font-size="14.5" fill="#475569">event.subhe.site</text></g><g><rect x="330" y="400" width="230" height="110" rx="10" fill="#ffffff" stroke="#8C4FFF" stroke-width="2"/><rect x="330" y="400" width="230" height="8" rx="4" fill="#8C4FFF"/><text x="445.0" y="436" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Amazon API Gateway</text><text x="445.0" y="462" text-anchor="middle" font-size="14.5" fill="#475569">HTTP API · api.subhe.site</text><text x="445.0" y="484" text-anchor="middle" font-size="14.5" fill="#475569">JWT authorizer</text></g><g><rect x="330" y="720" width="230" height="100" rx="10" fill="#ffffff" stroke="#DD344C" stroke-width="2"/><rect x="330" y="720" width="230" height="8" rx="4" fill="#DD344C"/><text x="445.0" y="756" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Amazon Cognito</text><text x="445.0" y="782" text-anchor="middle" font-size="14.5" fill="#475569">Sign-up · login</text><text x="445.0" y="804" text-anchor="middle" font-size="14.5" fill="#475569">admins group</text></g><g><rect x="660" y="130" width="250" height="110" rx="10" fill="#ffffff" stroke="#3F8624" stroke-width="2"/><rect x="660" y="130" width="250" height="8" rx="4" fill="#3F8624"/><text x="785.0" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Amazon S3 (private)</text><text x="785.0" y="192" text-anchor="middle" font-size="14.5" fill="#475569">site files · images/</text><text x="785.0" y="214" text-anchor="middle" font-size="14.5" fill="#475569">tickets/ (QR codes)</text></g><g><rect x="660" y="330" width="250" height="270" rx="10" fill="#ffffff" stroke="#ED7100" stroke-width="2"/><rect x="660" y="330" width="250" height="8" rx="4" fill="#ED7100"/><text x="785.0" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">AWS Lambda · API</text><text x="785.0" y="392" text-anchor="middle" font-size="14.5" fill="#475569">listEvents · getEvent</text><text x="785.0" y="414" text-anchor="middle" font-size="14.5" fill="#475569">createEvent · getUploadUrl</text><text x="785.0" y="436" text-anchor="middle" font-size="14.5" fill="#475569">registerEvent</text><text x="785.0" y="458" text-anchor="middle" font-size="14.5" fill="#475569">cancelRegistration</text><text x="785.0" y="480" text-anchor="middle" font-size="14.5" fill="#475569">getMyTickets</text><text x="785.0" y="502" text-anchor="middle" font-size="14.5" fill="#475569">checkIn · getStats</text><text x="785.0" y="524" text-anchor="middle" font-size="14.5" fill="#475569">(one IAM role per function)</text></g><g><rect x="1010" y="400" width="240" height="110" rx="10" fill="#ffffff" stroke="#2E73B8" stroke-width="2"/><rect x="1010" y="400" width="240" height="8" rx="4" fill="#2E73B8"/><text x="1130.0" y="436" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Amazon DynamoDB</text><text x="1130.0" y="462" text-ancho